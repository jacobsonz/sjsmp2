name: Build ZJSMP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build ZJSMP
        run: mvn -B clean package

      - name: Verify JAR
        run: |
          test -f target/ZJSMP.jar
          jar tf target/ZJSMP.jar | grep -q 'com/zjsmp/plugin/ZJSMPPlugin.class'
          jar tf target/ZJSMP.jar | grep -q 'plugin.yml'

      - name: Upload ZJSMP JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZJSMP-26.2-JAR
          path: target/ZJSMP.jar
          if-no-files-found: error
